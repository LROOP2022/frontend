name: Build and Push Docker Image

on:
  push:
    branches:
      - main

jobs:
  build:
    permissions:
      contents: read
      packages: write
    uses: LROOP2022/actions/.github/workflows/docker-build-push.yml@v1
    with:
      image: ghcr.io/lroop2022/web-site-frontend

  deploy:
    permissions:
      contents: write
    needs: build
    uses: LROOP2022/actions/.github/workflows/update-kustomize.yml@v1
    with:
      manifests_repo: LROOP2022/hack-manifests
      manifests_path: web-site/frontend
      service_name: frontend
      image_tag: sha-${{ github.sha }}
    secrets:
      K8S_REPO_TOKEN: ${{ secrets.K8S_REPO_TOKEN }}
