server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # для readiness/liveness проб
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # хешированные ассеты Vite — кэшируем надолго
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html не кэшируем, иначе новая версия не подхватится
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback для vue-router (createWebHistory)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
